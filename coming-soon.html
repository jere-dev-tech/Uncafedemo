<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Coffee Shop">

    <title>Coffee Shop</title>

    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="assets/media/favicon.png">


    <!-- All CSS files -->
    <link rel="stylesheet" href="assets/css/vendor/font-awesome.css">
    <link rel="stylesheet" href="assets/css/vendor/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/app.css">

</head>

<body class="tt-smooth-scroll">

     <!-- PRELOADER START -->
     <div id="preloader">
        <div class="coffeeloader">
            <div class="steam">
                <div class="smoke1"></div>
                <div class="smoke2"></div>
                <div class="smoke3"></div>
            </div>
            <div class="cupcontainer">
                <div class="cup"></div>
                <div class="glance"></div>
                <div class="handle"></div>
            </div>
            <div class="plate"></div>
            <div class="bottom"></div>
        </div>
    </div>
    <!-- PRELOADER END -->

    <!-- Main Wrapper Start -->
    <div id="scroll-container">

        <!-- COMING SOON START -->
        <section class="coming-soon-page">
            <div class="container">
                <div class="row">
                    <div class="cs-block">
                        <div class="title-area text-center">
                            <a href="index.html"><img src="assets/media/logo.png" alt="" class="mb-24"></a>
                        </div>
                        <h6 class="color-white mb-32 text-center">We are Under Construction</h6>
                        <div class="coming-soon-wrapper mb-32">
                            <ul class="unstyled countdown">
                                <li>
                                    <h2 class="h1">365</h2>
                                    <h6 class="fw-500">Days</h6>
                                </li>
                                <li>
                                    <h2 class="h1">24</h2>
                                    <h6 class="fw-500">Hrs</h6>
                                </li>
                                <li>
                                    <h2 class="h1">60</h2>
                                    <h6 class="fw-500">Min</h6>
                                </li>
                                <li>
                                    <h2 class="h1">60</h2>
                                    <h6 class="fw-500">Secs</h6>
                                </li>
                            </ul>
                        </div>
                        <div class="newsletter">
                            <h3 class="color-white font-primary coming-soon-text mb-32">Coming Soon</h3>
                            <div class="newsletter-heading justify-content-center mb-24">
                               
                                <div class="text text-center">
                                    <h3 class="color-white mb-8">Subscribe to Our Newsletter</h3>
                                    <p class="light-gray">Get notified when we are live</p>
                                </div>
                            </div>
                            <form action="index-3.html">
                                <div class="d-flex align-items-center flex-sm-nowrap flex-wrap gap-12 mb-16">
                                    <input type="email" id="subscribe-emial" class="form-control" name="subscribe-email"
                                        placeholder="Your Email">
                                    <button type="submit" class="cus-btn primary">
                                        Subscribe
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <!-- COMING SOON END --> 

    </div>
    <!-- Main Wrapper End -->

    <!-- Jquery Js -->
    <script src="assets/js/vendor/bootstrap.min.js"></script>
    <script src="assets/js/vendor/jquery-3.6.3.min.js"></script>
    <script src="assets/js/vendor/jquery.countdown.min.js"></script>

    <script src="assets/js/app.js"></script>
</body>
</html>
